# GitLab CI for jclaw.
#
# Stages
#   verify   source-integrity scan (no toolchain needed)
#   build    compile + full test suite, publishes JUnit reports and the uber jar
#   native   GraalVM native image, built and smoke-tested on every pipeline; a broken native
#            build fails the pipeline the same way a broken test does
#   release  on tags only: publishes the native binary (and the uber jar) as a GitLab Release
#
# Assumes a Docker-executor runner. Maven's local repository is cached per branch so
# a warm pipeline downloads nothing.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never                      # one pipeline per change: the MR one wins
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages: [verify, build, native, release]

variables:
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress --errors --fail-at-end -Dstyle.color=always"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Djava.awt.headless=true"
  MAVEN_VERSION: "3.9.11"
  GIT_DEPTH: "20"
  # The runner's DNS intermittently fails to resolve the GitLab host, and the clone dies with
  # "Could not resolve host ... (Timeout while contacting DNS servers)" before any script runs.
  # GitLab reports that as `script_failure` — the same class as a failing test — so `retry:when`
  # cannot tell the two apart and retrying on it would mask real breaks. These three make the
  # *runner* retry the fetch itself, which is exactly the step that fails and nothing else.
  # A mitigation, not a fix: the fix is on the runner host.
  GET_SOURCES_ATTEMPTS: "3"
  RESTORE_CACHE_ATTEMPTS: "3"
  ARTIFACT_DOWNLOAD_ATTEMPTS: "3"

default:
  interruptible: true

.maven-cache: &maven-cache
  cache:
    key:
      files: [pom.xml, jclaw-app/pom.xml]
      prefix: maven
    paths: [.m2/repository]
    policy: pull-push

byte-verify:
  stage: verify
  image: debian:bookworm-slim
  script:
    - ./scripts/byte-verify.sh scan

build-test:
  stage: build
  image: maven:3.9.11-eclipse-temurin-21
  <<: *maven-cache
  script:
    - java -version && mvn -version
    - mvn $MAVEN_CLI_OPTS verify
  after_script:
    # One-line summary in the job log. Counts <testcase> elements in the XML reports: the
    # .txt files report 0 for classes whose tests live in @Nested classes, and the
    # testsuite "tests" attribute can undercount them by one.
    - |
      if ls */target/surefire-reports/TEST-*.xml >/dev/null 2>&1; then
        printf 'TOTAL testcases=%s failures=%s errors=%s skipped=%s\n' \
          "$(grep -h -c '<testcase ' */target/surefire-reports/TEST-*.xml | awk '{s+=$1} END{print s}')" \
          "$(grep -h -c '<failure' */target/surefire-reports/TEST-*.xml | awk '{s+=$1} END{print s}')" \
          "$(grep -h -c '<error' */target/surefire-reports/TEST-*.xml | awk '{s+=$1} END{print s}')" \
          "$(grep -h -c '<skipped' */target/surefire-reports/TEST-*.xml | awk '{s+=$1} END{print s}')"
      fi
  artifacts:
    when: always
    expire_in: 2 weeks
    reports:
      junit: "*/target/surefire-reports/TEST-*.xml"
    paths:
      - jclaw-app/target/jclaw-app-*.jar
      - "*/target/surefire-reports/"

native-image:
  stage: native
  image:
    name: ghcr.io/graalvm/native-image-community:25
    # The image's ENTRYPOINT is `native-image` itself. Without clearing it, the runner hands
    # its shell-detection script to native-image as arguments and the job dies before the
    # first script line with "Unrecognized option(s)" (exit code 20).
    entrypoint: [""]
  needs: [build-test]
  cache:
    key:
      files: [pom.xml, jclaw-app/pom.xml]
      prefix: maven
    paths: [.m2/repository]
    policy: pull                       # never write the cache from the slow job
  before_script:
    # Maven Central, not dlcdn.apache.org: the Apache mirror keeps only the current release, so
    # a pinned version 404s the moment the next one ships. Central keeps every release.
    - curl -fsSL "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}/apache-maven-${MAVEN_VERSION}-bin.tar.gz" | tar xz -C /opt
    - export PATH="/opt/apache-maven-${MAVEN_VERSION}/bin:$PATH"
    - java -version && native-image --version && mvn -version
  script:
    - mvn $MAVEN_CLI_OPTS install -DskipTests
    - mvn $MAVEN_CLI_OPTS -Pnative -pl jclaw-app package -DskipTests
    - ls -la jclaw-app/target/jclaw
    - ./jclaw-app/target/jclaw --version
    - ./jclaw-app/target/jclaw run "smoke test"          # mock provider, no network
    # Everything below exercises a path `run` never reaches, and every one of them is the kind
    # a native image breaks: JCA providers for the vault's AES-256-GCM and the extension
    # signature's Ed25519, and a reflectively loaded JDBC driver for `storage=sql`. With
    # `--no-fallback` a missing registration is a crash rather than a degradation, so the only
    # way to know the binary works is to make it do the work. They pass today; this is what
    # keeps them passing.
    - export SMOKE=$(mktemp -d)
    - export JC="./jclaw-app/target/jclaw --jclaw.workspace=$SMOKE --jclaw.state-dir=$SMOKE/state --jclaw.provider=mock --jclaw.approval-mode=trusted"
    # Vault: AES-256-GCM seal and open, and the owner-only key file generated on first use.
    - printf 's3cret-value-0123456789' | $JC secrets set ci --capability builtin.http_fetch --host api.example.com
    - $JC secrets list | grep -q "api.example.com"
    # Extensions: Ed25519 key generation, signing, and verification against a trusted publisher.
    - mkdir -p $SMOKE/pkg
    - $JC extensions keygen --out $SMOKE/keys
    - printf '{"name":"ci","version":"1.0","kind":"skill","description":"ci probe","publisher":"ci"}' > $SMOKE/pkg/jclaw-extension.json
    - 'printf -- ''---\nname: CI\ndescription: d\nwhen-to-use: w\n---\nBody.\n'' > $SMOKE/pkg/SKILL.md'
    - $JC extensions sign $SMOKE/pkg --key $SMOKE/keys/publisher.key
    - $JC extensions install $SMOKE/pkg --jclaw.trusted-publishers.ci="$(cat $SMOKE/keys/publisher.pub)"
    - $JC extensions list | grep -q VERIFIED
    # Inbound screening: the review queue binds and the CLI works it. A foreign message that
    # started a turn anyway would be the failure worth catching.
    - $JC inbound list | grep -q 'nothing held'
    # Secret staging: a credential that reaches a child process's environment and never the
    # command line. AES-GCM is already covered above; what is new here is the binding kind and
    # the picocli flag, both of which AOT could plausibly have dropped.
    - printf 'ghp-ci-staged-0123456789' | $JC secrets set ci-gh --capability builtin.shell --subprocess
    - $JC secrets list | grep -q 'subprocess environment'
    - $JC run "stage it" '--jclaw.mock-script[0]=tool:builtin.shell:command=printf %s "$CI_GH",secret_env={"CI_GH":"ci-gh"}' '--jclaw.mock-script[1]=text:done'
    - $JC status -n 8 | grep -q secret.injected
    - "! grep -rq ghp-ci-staged-0123456789 $SMOKE/state"   # the value is in no store
    - $JC run "leak scan" --jclaw.hooks=budget-notice,secret-leak-scan --jclaw.mock-script=text:done
    # Registry: an index served from a file:// URL is refused by the egress guard, so the
    # reachable half is checked instead — a profile applied to the package just installed, and
    # the message a missing registry setting produces. Both exercise the picocli subcommands and
    # the property binding that AOT is most likely to have dropped.
    - $JC extensions profile --jclaw.extension-profiles.ci=ci --jclaw.extension-profile=ci | grep -q "(active)"
    - $JC extensions profile ci --jclaw.extension-profiles.ci=ci
    - $JC extensions profile off --jclaw.extension-profiles.off= | grep -q "disabled ci"
    - $JC extensions list | grep -q disabled
    # `search` exits non-zero without a registry, which is the point, so the output is captured
    # rather than piped: under `pipefail` a matching grep would still inherit that exit code.
    - $JC extensions search anything > $SMOKE/search.txt 2>&1 || true
    - grep -q 'no registries configured' $SMOKE/search.txt
    # SQL storage: the H2 driver loads, migrations apply, and a turn round-trips through it.
    - ./jclaw-app/target/jclaw run "sql smoke" --jclaw.workspace=$SMOKE --jclaw.state-dir=$SMOKE/sql --jclaw.provider=mock --jclaw.approval-mode=trusted --jclaw.storage=sql
    - ./jclaw-app/target/jclaw status -n 3 --jclaw.workspace=$SMOKE --jclaw.state-dir=$SMOKE/sql --jclaw.provider=mock --jclaw.storage=sql | grep -q "run.finished"
    # Schema 2 (a table per busy store) and 3 (materialised projections) reached the database,
    # and the projection a finished run wrote reads back through the pooled connection.
    # The thread lock is a row under sql, so schema 4 and its table must be there: a missing
    # lock table would silently mean no exclusion at all between two hosts.
    - ./jclaw-app/target/jclaw doctor --jclaw.workspace=$SMOKE --jclaw.state-dir=$SMOKE/sql --jclaw.provider=mock --jclaw.storage=sql || true
    - export SQLRUN=$(./jclaw-app/target/jclaw status -n 20 --jclaw.workspace=$SMOKE --jclaw.state-dir=$SMOKE/sql --jclaw.provider=mock --jclaw.storage=sql | grep -o 'run_[0-9a-f]*' | head -1)
    - ./jclaw-app/target/jclaw status --run $SQLRUN --spans --jclaw.workspace=$SMOKE --jclaw.state-dir=$SMOKE/sql --jclaw.provider=mock --jclaw.storage=sql | grep -q COMPLETED
    # A loop family defined in configuration, and the startup validation that catches a typo in
    # one. Both are pure wiring, which is exactly what AOT is most likely to have dropped.
    - $JC run "family" --jclaw.loop-families.strict.base=reflective --jclaw.loop-families.strict.review-instruction=REVIEW-IT --jclaw.loop-family=strict '--jclaw.mock-script[0]=text:draft' '--jclaw.mock-script[1]=text:REVIEWED' | grep -q REVIEWED
    - "! $JC run x --jclaw.loop-family=nope"
    - "! $JC run x --jclaw.loop-families.canonical.base=reflective --jclaw.loop-families.canonical.review-instruction=x"
    # Triggers: a watch, a webhook topic, and the inbound-message event type all bind and
    # round-trip through the store. A watch also proves the durable fingerprint works across
    # processes, which is the whole reason it is not held in memory.
    - mkdir -p $SMOKE/src && echo 'class One {}' > $SMOKE/src/One.java
    - $JC routines add --name ci-watch --watch 'src/**/*.java' -- look at it
    - $JC routines add --name ci-hook --webhook --topic deploys -- handle it
    - $JC routines add --name ci-inbox --on turn.submitted --when thread=inbox -- triage it
    - $JC routines list | grep -q 'topic=deploys'
    - $JC worker --once                       # baseline; the first look never fires
    - echo 'class Two {}' > $SMOKE/src/Two.java
    - $JC worker --once | grep -q 'watch src'
    # MCP: a remote server configured with OAuth 2.1 client credentials round-trips through the
    # store. Nothing is contacted — the point is that the record binds and replays under AOT.
    - $JC mcp add --name ci-oauth --url https://mcp.example.com/mcp --oauth-client-id jclaw --oauth-client-secret ci-oauth-secret
    - $JC mcp list | grep -q ci-oauth
    - "! $JC mcp add --name ci-both --url https://mcp.example.com/mcp --auth-secret a --oauth-client-id b --oauth-client-secret c"
    # Spans: `--spans` is the option `--trace` could never be, since that name is claimed
    # process-wide for verbosity. Cheap to check and silent to lose.
    - $JC run "metrics" --jclaw.mock-script=text:done
    - $JC status --run $($JC status -n 20 | grep -o 'run_[0-9a-f]*' | head -1) --spans | grep -q "model.call"
    - ./jclaw-app/target/jclaw doctor || true            # informational in CI
    - echo "NATIVE_ARCH=$(uname -m)" > native.env        # the release job names the asset by it
  artifacts:
    expire_in: 4 weeks
    paths: [jclaw-app/target/jclaw]
    reports:
      dotenv: native.env
  # Mandatory: no rules of its own, so it runs wherever the workflow admits a pipeline, and
  # no allow_failure, so a failure blocks the pipeline (and merge, with "pipelines must
  # succeed" enabled).
  timeout: 45m

# Publishes a GitLab Release for the tag with the native binary and the uber jar attached.
# The files go to the project's generic package registry (a release cannot host files itself)
# and the release links to them. Plain curl against the REST API, authenticated with the job
# token: the official release-cli image is amd64-only and the runner is arm64.
release:
  stage: release
  image:
    # Same image native-image already pulled: runs as root (the curl images run as an
    # unprivileged user that may not be able to write the build directory), ships curl and
    # sha256sum, and needs the same entrypoint override.
    name: ghcr.io/graalvm/native-image-community:25
    entrypoint: [""]
  needs: [build-test, native-image]    # brings their artifacts and native-image's NATIVE_ARCH
  variables:
    GIT_STRATEGY: none                 # nothing here reads the sources
    PKG_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/jclaw/${CI_COMMIT_TAG}"
  script:
    - |
      set -eu
      BIN="jclaw-linux-${NATIVE_ARCH}"
      JAR="$(cd jclaw-app/target && ls jclaw-app-*.jar | head -1)"
      cp "jclaw-app/target/jclaw" "$BIN"
      cp "jclaw-app/target/$JAR" "$JAR"
      sha256sum "$BIN" "$JAR" | tee SHA256SUMS
      for f in "$BIN" "$JAR" SHA256SUMS; do
        echo "uploading $f"
        curl -fsS --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" "${PKG_URL}/${f}"
        echo
      done
      cat > release.json <<EOF
      {
        "name": "jclaw ${CI_COMMIT_TAG}",
        "tag_name": "${CI_COMMIT_TAG}",
        "ref": "${CI_COMMIT_SHA}",
        "description": "jclaw ${CI_COMMIT_TAG} (commit ${CI_COMMIT_SHORT_SHA}).\\n\\n- ${BIN}: GraalVM native image, Linux ${NATIVE_ARCH}\\n- ${JAR}: uber jar, needs Java 21+\\n- SHA256SUMS\\n\\nBuilt by pipeline ${CI_PIPELINE_URL}",
        "assets": { "links": [
          { "name": "${BIN}", "url": "${PKG_URL}/${BIN}", "link_type": "package" },
          { "name": "${JAR}", "url": "${PKG_URL}/${JAR}", "link_type": "package" },
          { "name": "SHA256SUMS", "url": "${PKG_URL}/SHA256SUMS", "link_type": "other" }
        ] }
      }
      EOF
      curl -fsS --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --header "Content-Type: application/json" \
           --data @release.json "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
      echo
      echo "released ${CI_PROJECT_URL}/-/releases/${CI_COMMIT_TAG}"
  rules:
    - if: $CI_COMMIT_TAG
