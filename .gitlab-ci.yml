# GitLab CI for jclaw.
#
# Stages
#   verify   source-integrity and licence-header scans (no toolchain needed)
#   build    compile + full test suite (with coverage), and static analysis alongside it
#   native   GraalVM native image, built and smoke-tested on every pipeline; a broken native
#            build fails the pipeline the same way a broken test does
#   deploy   publishes coverage: the Cobertura report GitLab paints onto merge request diffs,
#            and the HTML report to this instance's Pages when it has them
#   release  on tags only: publishes the native binary (and the uber jar) as a GitLab Release
#
# Assumes a Docker-executor runner. Maven's local repository is cached per branch so
# a warm pipeline downloads nothing.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never                      # one pipeline per change: the MR one wins
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages: [verify, build, native, deploy, release]

variables:
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress --errors --fail-at-end -Dstyle.color=always"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Djava.awt.headless=true"
  MAVEN_VERSION: "3.9.11"
  GIT_DEPTH: "20"
  # The runner's DNS intermittently fails to resolve the GitLab host, and the clone dies with
  # "Could not resolve host ... (Timeout while contacting DNS servers)" before any script runs.
  # GitLab reports that as `script_failure` — the same class as a failing test — so `retry:when`
  # cannot tell the two apart and retrying on it would mask real breaks. These three make the
  # *runner* retry the fetch itself, which is exactly the step that fails and nothing else.
  # A mitigation, not a fix: the fix is on the runner host.
  GET_SOURCES_ATTEMPTS: "3"
  RESTORE_CACHE_ATTEMPTS: "3"
  ARTIFACT_DOWNLOAD_ATTEMPTS: "3"

default:
  interruptible: true

.maven-cache: &maven-cache
  cache:
    key:
      files: [pom.xml, jclaw-app/pom.xml]
      prefix: maven
    paths: [.m2/repository]
    policy: pull-push

byte-verify:
  stage: verify
  image: debian:bookworm-slim
  script:
    - ./scripts/byte-verify.sh scan

license-verify:
  stage: verify
  image: debian:bookworm-slim
  script:
    - ./scripts/license-check.sh

readme-sync:
  stage: verify
  image: debian:bookworm-slim
  # The two READMEs are generated from one body, and drift is invisible until somebody reads the
  # wrong one: a GitLab reader sent to github.io, or a GitHub reader to a page they cannot open.
  script:
    - ./scripts/readme-sync.sh --check

build-test:
  stage: build
  image: maven:3.9.11-eclipse-temurin-21
  # Docker-in-Docker, so PostgresStorageIntegrationTest starts a real PostgreSQL instead of
  # skipping: everything under jclaw.storage=sql was written against embedded H2, and SqlSchema
  # only claims its DDL is portable. This is what checks the claim on every push.
  #
  # Three things had to line up, each learned from a failed run rather than guessed:
  #
  #  - The job must declare the service. The runner is *named* docker-dind and exports
  #    DOCKER_TLS_VERIFY=1 and DOCKER_TLS_CERTDIR=/certs, but it starts no daemon on its own:
  #    without a `services:` entry there is no "Starting service" line, /certs/client is empty,
  #    and nothing is listening.
  #  - The alias cannot be `docker`. That one is taken — "alias is already in use by another
  #    service" — so this uses `dind` and addresses the daemon by that name.
  #  - The inherited TLS variables must be cleared, not worked around. Leaving
  #    DOCKER_TLS_VERIFY=1 set while pointing at the plain-TCP port makes docker-java attempt
  #    TLS with no certificates, which surfaces as a null SSL context and no Docker at all.
  #
  # Plain TCP is safe here: the daemon exists only for this job and is reachable only from its
  # network. The test is @Testcontainers(disabledWithoutDocker = true), so if any of this stops
  # working it goes back to skipping and the job still passes.
  services:
    - name: docker:27-dind
      alias: dind
  variables:
    DOCKER_HOST: tcp://dind:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_TLS_VERIFY: ""
    DOCKER_CERT_PATH: ""
    # The daemon is discarded with the job, so there is nothing for Ryuk to reap, and it wants a
    # socket mount this job does not have.
    TESTCONTAINERS_RYUK_DISABLED: "true"
  <<: *maven-cache
  script:
    - java -version && mvn -version
    - 'timeout 30 bash -c "until (echo > /dev/tcp/dind/2375) 2>/dev/null; do sleep 1; done" && echo "dind reachable" || echo "dind NOT reachable"'
    - mvn $MAVEN_CLI_OPTS verify
  # Scraped from the job log by the `coverage` keyword, which is what puts the number on the MR
  # widget, the pipeline page and the project badge. The line comes from scripts/coverage.sh so
  # that the two pipelines cannot disagree about what the project's coverage is.
  coverage: '/TOTAL coverage: (\d+\.\d+)%/'
  after_script:
    # One-line summary in the job log. Counts <testcase> elements in the XML reports: the
    # .txt files report 0 for classes whose tests live in @Nested classes, and the
    # testsuite "tests" attribute can undercount them by one.
    - |
      ./scripts/coverage.sh || true
      if ls */target/surefire-reports/TEST-*.xml >/dev/null 2>&1; then
        printf 'TOTAL testcases=%s failures=%s errors=%s skipped=%s\n' \
          "$(grep -h -c '<testcase ' */target/surefire-reports/TEST-*.xml | awk '{s+=$1} END{print s}')" \
          "$(grep -h -c '<failure' */target/surefire-reports/TEST-*.xml | awk '{s+=$1} END{print s}')" \
          "$(grep -h -c '<error' */target/surefire-reports/TEST-*.xml | awk '{s+=$1} END{print s}')" \
          "$(grep -h -c '<skipped' */target/surefire-reports/TEST-*.xml | awk '{s+=$1} END{print s}')"
      fi
  artifacts:
    when: always
    expire_in: 2 weeks
    reports:
      junit: "*/target/surefire-reports/TEST-*.xml"
    paths:
      - jclaw-app/target/jclaw-app-*.jar
      - "*/target/surefire-reports/"
      # Browsable in the job's artifacts, which is where the per-class detail behind the
      # percentage lives. GitLab renders coverage on the diff itself only from a Cobertura
      # report, and getting one out of JaCoCo means a Python converter and an apt-get in this
      # job — a lot of machinery for diff highlighting, so it is deliberately not here.
      - jclaw-app/target/site/jacoco-aggregate/

static-analysis:
  stage: build
  image: maven:3.9.11-eclipse-temurin-21
  # Beside build-test rather than after it: nothing here needs the test results, and the two
  # together are still shorter than running them in sequence. `-DskipTests` skips *running* the
  # tests, not compiling them — the lint gate has an opinion about test sources too, and
  # `maven.test.skip` would hide them from it.
  #
  # This is the profile documented in AGENTS.md: javac -Xlint:all with failOnWarning, SpotBugs
  # with FindSecBugs, and PMD. All three fail the build, so a finding here is a red pipeline and
  # not a report nobody opens.
  <<: *maven-cache
  script:
    - mvn $MAVEN_CLI_OPTS -Panalysis verify -DskipTests
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - "*/target/spotbugsXml.xml"
      - "*/target/pmd.xml"

native-image:
  stage: native
  image:
    name: ghcr.io/graalvm/native-image-community:25
    # The image's ENTRYPOINT is `native-image` itself. Without clearing it, the runner hands
    # its shell-detection script to native-image as arguments and the job dies before the
    # first script line with "Unrecognized option(s)" (exit code 20).
    entrypoint: [""]
  # A real PostgreSQL for the binary to talk to. A plain GitLab service, not dind: the daemon is
  # only needed to *start* a database, and a service already is one, reachable on the job network.
  #
  # This is the combination nothing else covers. PostgresStorageIntegrationTest is a
  # @SpringBootTest, so it proves the schema and the stores work on the JVM; the smoke steps
  # below proved the binary works, but against embedded H2. The interesting failure lives in the
  # gap: a JDBC driver is resolved reflectively from the URL, and `--no-fallback` turns a missing
  # registration into a crash rather than a degradation. Only the native binary pointed at
  # PostgreSQL can show that it does not.
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: jclaw
    POSTGRES_USER: jclaw
    POSTGRES_PASSWORD: jclaw-ci-password
    # native-image sizes its heap from the host, and that default is the bug: left alone it
    # claimed ~75% of this runner and was killed mid-build with "The Native Image build process
    # ran out of memory" on roughly every other pipeline. The message says "use a bigger
    # machine" and means the opposite.
    #
    # The build needs about four gigabytes and no more. Measured, on the same architecture and
    # GraalVM major: a 9 GB ceiling peaks at 3.67 GiB in 1m23s, a 6 GB ceiling peaks at
    # 3.75 GiB in 1m24s. The ceiling barely moves the peak, because a Java heap is lazy — hand
    # it room it does not need and it grows into that room before collecting, which is how a
    # builder wanting four gigabytes gets itself killed asking for twelve. Cap it and the GC
    # simply does its job.
    #
    # **This requirement is absolute, not proportional, so the cap is a fixed size and it has
    # to be rechecked whenever the runner is resized.** That is not hypothetical: the runner
    # went from ~16.7 GB to 12.5 GB, which silently turned this same setting from 48% of the
    # host into 64% of it, and the OOM came straight back. At 6 GB the builder takes 48% of
    # today's 12.5 GB and leaves 6.5 GB for PostgreSQL, the runner and page cache, with ~1.6x
    # headroom over the measured peak. A runner below ~10 GB needs this number revisited rather
    # than inherited.
    #
    # --parallelism=4 rides along to hold the peak working set down on a shared box, and it is
    # worth recording that it was tried *alone* first and did nothing: the job OOMed at the
    # same stage with "4 thread(s) ... set via '--parallelism=4'" in the log. It is margin, not
    # the fix.
    #
    # An environment variable rather than a <buildArg>, so a developer's machine keeps its own
    # cores and memory. Self-verifying either way: the build output echoes "Picked up
    # NATIVE_IMAGE_OPTIONS:" and then reports the heap as a percentage of the host it actually
    # found, so a job log shows both that the cap took effect and what fraction of the machine
    # it is currently claiming -- which is the number that goes wrong after a resize.
    NATIVE_IMAGE_OPTIONS: "--parallelism=4 -J-Xmx6g"
  needs: [build-test]
  cache:
    key:
      files: [pom.xml, jclaw-app/pom.xml]
      prefix: maven
    paths: [.m2/repository]
    policy: pull                       # never write the cache from the slow job
  before_script:
    # Maven Central, not dlcdn.apache.org: the Apache mirror keeps only the current release, so
    # a pinned version 404s the moment the next one ships. Central keeps every release.
    - curl -fsSL "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_VERSION}/apache-maven-${MAVEN_VERSION}-bin.tar.gz" | tar xz -C /opt
    - export PATH="/opt/apache-maven-${MAVEN_VERSION}/bin:$PATH"
    - java -version && native-image --version && mvn -version
    # Diagnostic, temporary. native-image reports its heap as a percentage of "system memory",
    # and that figure is the host's -- it is not necessarily what this container may actually
    # use. A cgroup limit below it would let the builder size itself for room it will never
    # get, which looks exactly like the OOM this job keeps producing: killed well under its own
    # -Xmx ceiling. These three lines say which it is, and cost a second.
    - 'echo "--- cgroup v2 memory.max:"; cat /sys/fs/cgroup/memory.max 2>/dev/null || echo "(none)"'
    - 'echo "--- cgroup v1 limit_in_bytes:"; cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || echo "(none)"'
    - 'echo "--- free -m:"; free -m 2>/dev/null || grep -E "MemTotal|MemAvailable" /proc/meminfo'
  script:
    - mvn $MAVEN_CLI_OPTS install -DskipTests
    - mvn $MAVEN_CLI_OPTS -Pnative -pl jclaw-app package -DskipTests
    - ls -la jclaw-app/target/jclaw
    - ./jclaw-app/target/jclaw --version
    - ./jclaw-app/target/jclaw run "smoke test"          # mock provider, no network
    # Everything below exercises a path `run` never reaches, and every one of them is the kind
    # a native image breaks: JCA providers for the vault's AES-256-GCM and the extension
    # signature's Ed25519, and a reflectively loaded JDBC driver for `storage=sql`. With
    # `--no-fallback` a missing registration is a crash rather than a degradation, so the only
    # way to know the binary works is to make it do the work. They pass today; this is what
    # keeps them passing.
    - export SMOKE=$(mktemp -d)
    - export JC="./jclaw-app/target/jclaw --jclaw.workspace=$SMOKE --jclaw.state-dir=$SMOKE/state --jclaw.provider=mock --jclaw.approval-mode=trusted"
    # Vault: AES-256-GCM seal and open, and the owner-only key file generated on first use.
    - printf 's3cret-value-0123456789' | $JC secrets set ci --capability builtin.http_fetch --host api.example.com
    - $JC secrets list | grep -q "api.example.com"
    # Extensions: Ed25519 key generation, signing, and verification against a trusted publisher.
    - mkdir -p $SMOKE/pkg
    - $JC extensions keygen --out $SMOKE/keys
    - printf '{"name":"ci","version":"1.0","kind":"skill","description":"ci probe","publisher":"ci"}' > $SMOKE/pkg/jclaw-extension.json
    - 'printf -- ''---\nname: CI\ndescription: d\nwhen-to-use: w\n---\nBody.\n'' > $SMOKE/pkg/SKILL.md'
    - $JC extensions sign $SMOKE/pkg --key $SMOKE/keys/publisher.key
    - $JC extensions install $SMOKE/pkg --jclaw.trusted-publishers.ci="$(cat $SMOKE/keys/publisher.pub)"
    - $JC extensions list | grep -q VERIFIED
    # Inbound screening: the review queue binds and the CLI works it. A foreign message that
    # started a turn anyway would be the failure worth catching.
    - $JC inbound list | grep -q 'nothing held'
    # Secret staging: a credential that reaches a child process's environment and never the
    # command line. AES-GCM is already covered above; what is new here is the binding kind and
    # the picocli flag, both of which AOT could plausibly have dropped.
    - printf 'ghp-ci-staged-0123456789' | $JC secrets set ci-gh --capability builtin.shell --subprocess
    - $JC secrets list | grep -q 'subprocess environment'
    - $JC run "stage it" '--jclaw.mock-script[0]=tool:builtin.shell:command=printf %s "$CI_GH",secret_env={"CI_GH":"ci-gh"}' '--jclaw.mock-script[1]=text:done'
    - $JC status -n 8 | grep -q secret.injected
    - "! grep -rq ghp-ci-staged-0123456789 $SMOKE/state"   # the value is in no store
    - $JC run "leak scan" --jclaw.hooks=budget-notice,secret-leak-scan --jclaw.mock-script=text:done
    # Registry: an index served from a file:// URL is refused by the egress guard, so the
    # reachable half is checked instead — a profile applied to the package just installed, and
    # the message a missing registry setting produces. Both exercise the picocli subcommands and
    # the property binding that AOT is most likely to have dropped.
    - $JC extensions profile --jclaw.extension-profiles.ci=ci --jclaw.extension-profile=ci | grep -q "(active)"
    - $JC extensions profile ci --jclaw.extension-profiles.ci=ci
    - $JC extensions profile off --jclaw.extension-profiles.off= | grep -q "disabled ci"
    - $JC extensions list | grep -q disabled
    # `search` exits non-zero without a registry, which is the point, so the output is captured
    # rather than piped: under `pipefail` a matching grep would still inherit that exit code.
    - $JC extensions search anything > $SMOKE/search.txt 2>&1 || true
    - grep -q 'no registries configured' $SMOKE/search.txt
    # SQL storage: the H2 driver loads, migrations apply, and a turn round-trips through it.
    - ./jclaw-app/target/jclaw run "sql smoke" --jclaw.workspace=$SMOKE --jclaw.state-dir=$SMOKE/sql --jclaw.provider=mock --jclaw.approval-mode=trusted --jclaw.storage=sql
    - ./jclaw-app/target/jclaw status -n 3 --jclaw.workspace=$SMOKE --jclaw.state-dir=$SMOKE/sql --jclaw.provider=mock --jclaw.storage=sql | grep -q "run.finished"
    # Schema 2 (a table per busy store) and 3 (materialised projections) reached the database,
    # and the projection a finished run wrote reads back through the pooled connection.
    # The thread lock is a row under sql, so schema 4 and its table must be there: a missing
    # lock table would silently mean no exclusion at all between two hosts.
    # The same binary against a real PostgreSQL, which is where a reflectively loaded driver
    # would actually fail. Everything above this line used embedded H2.
    - 'timeout 60 bash -c "until (echo > /dev/tcp/postgres/5432) 2>/dev/null; do sleep 1; done" && echo "postgres reachable"'
    - export PGDIR=$(mktemp -d)
    # The credential is scoped to these invocations with `env`, not exported. Exporting it broke
    # the H2 steps that follow: they share this shell, their database was created earlier with no
    # password, and an inherited one is then rejected with "Wrong user name or password". Two
    # databases in one script must not share a credential variable.
    - export JCPG="env JCLAW_DATASOURCE_PASSWORD=jclaw-ci-password ./jclaw-app/target/jclaw --jclaw.workspace=$PGDIR --jclaw.state-dir=$PGDIR/state --jclaw.provider=mock --jclaw.approval-mode=trusted --jclaw.storage=sql --jclaw.datasource-url=jdbc:postgresql://postgres:5432/jclaw --jclaw.datasource-username=jclaw"
    # A turn proves the driver loads, every migration applies, and writes land.
    - $JCPG run "native on postgres" --jclaw.mock-script=text:pg-ok | grep -q pg-ok
    # Reads come back out of PostgreSQL, not out of a cache in the same process.
    - $JCPG status -n 5 | grep -q "run.finished"
    - export PGRUN=$($JCPG status -n 20 | grep -o 'run_[0-9a-f]*' | head -1)
    - $JCPG status --run $PGRUN --spans | grep -q COMPLETED
    # The vault over SQL: AES-GCM through a different JDBC driver than the H2 run above.
    - printf 'pg-secret-value-0123456789' | $JCPG secrets set pg --capability builtin.http_fetch --host api.example.com
    - $JCPG secrets list | grep -q api.example.com
    - ./jclaw-app/target/jclaw doctor --jclaw.workspace=$SMOKE --jclaw.state-dir=$SMOKE/sql --jclaw.provider=mock --jclaw.storage=sql || true
    - export SQLRUN=$(./jclaw-app/target/jclaw status -n 20 --jclaw.workspace=$SMOKE --jclaw.state-dir=$SMOKE/sql --jclaw.provider=mock --jclaw.storage=sql | grep -o 'run_[0-9a-f]*' | head -1)
    - ./jclaw-app/target/jclaw status --run $SQLRUN --spans --jclaw.workspace=$SMOKE --jclaw.state-dir=$SMOKE/sql --jclaw.provider=mock --jclaw.storage=sql | grep -q COMPLETED
    # A loop family defined in configuration, and the startup validation that catches a typo in
    # one. Both are pure wiring, which is exactly what AOT is most likely to have dropped.
    - $JC run "family" --jclaw.loop-families.strict.base=reflective --jclaw.loop-families.strict.review-instruction=REVIEW-IT --jclaw.loop-family=strict '--jclaw.mock-script[0]=text:draft' '--jclaw.mock-script[1]=text:REVIEWED' | grep -q REVIEWED
    - "! $JC run x --jclaw.loop-family=nope"
    - "! $JC run x --jclaw.loop-families.canonical.base=reflective --jclaw.loop-families.canonical.review-instruction=x"
    # Triggers: a watch, a webhook topic, and the inbound-message event type all bind and
    # round-trip through the store. A watch also proves the durable fingerprint works across
    # processes, which is the whole reason it is not held in memory.
    - mkdir -p $SMOKE/src && echo 'class One {}' > $SMOKE/src/One.java
    - $JC routines add --name ci-watch --watch 'src/**/*.java' -- look at it
    - $JC routines add --name ci-hook --webhook --topic deploys -- handle it
    - $JC routines add --name ci-inbox --on turn.submitted --when thread=inbox -- triage it
    - $JC routines list | grep -q 'topic=deploys'
    - $JC worker --once                       # baseline; the first look never fires
    - echo 'class Two {}' > $SMOKE/src/Two.java
    - $JC worker --once | grep -q 'watch src'
    # MCP: a remote server configured with OAuth 2.1 client credentials round-trips through the
    # store. Nothing is contacted — the point is that the record binds and replays under AOT.
    - $JC mcp add --name ci-oauth --url https://mcp.example.com/mcp --oauth-client-id jclaw --oauth-client-secret ci-oauth-secret
    - $JC mcp list | grep -q ci-oauth
    - "! $JC mcp add --name ci-both --url https://mcp.example.com/mcp --auth-secret a --oauth-client-id b --oauth-client-secret c"
    # Spans: `--spans` is the option `--trace` could never be, since that name is claimed
    # process-wide for verbosity. Cheap to check and silent to lose.
    - $JC run "metrics" --jclaw.mock-script=text:done
    - $JC status --run $($JC status -n 20 | grep -o 'run_[0-9a-f]*' | head -1) --spans | grep -q "model.call"
    - ./jclaw-app/target/jclaw doctor || true            # informational in CI
    - echo "NATIVE_ARCH=$(uname -m)" > native.env        # the release job names the asset by it
  artifacts:
    expire_in: 4 weeks
    paths: [jclaw-app/target/jclaw]
    reports:
      dotenv: native.env
  # Mandatory: no rules of its own, so it runs wherever the workflow admits a pipeline, and
  # no allow_failure, so a failure blocks the pipeline (and merge, with "pipelines must
  # succeed" enabled).
  timeout: 45m

# The coverage report, served by this GitLab rather than by the other remote. The mirror computes
# its own coverage on every pipeline; sending a reader to github.io to look at it would make a
# private instance depend on a public one for a number it already has.
#
# GitLab Pages is a job named `pages` whose artifact is a directory called `public`, which is why
# this copies rather than configures. `needs: [build-test]` fetches that job's artifacts — the
# aggregate report is already among them — and lets this start the moment the tests are done
# instead of waiting for the native image two stages ahead of it.
#
# Default branch only: a report published from a topic branch would describe something nobody has
# merged, and Pages keeps one site per project.
#
# Worth knowing before the first deploy: whether the site is public depends on the instance's
# Pages access control, not on this file. Here that costs nothing — the same sources are public
# on GitHub — but a JaCoCo report does embed source listings, so it is the wrong pattern to copy
# into a project whose code is actually private.
# Coverage on the merge request diff itself: GitLab colours covered and uncovered lines from a
# Cobertura report, and reads no other format. JaCoCo does not emit one, so scripts/ converts.
#
# In-tree rather than the published converter image, for two reasons that both bite here: that
# image is amd64-only and this runner is arm64, and it carries no versioned tag, so using it means
# using whatever `latest` points at on the day. The script is stdlib-only python3, verified
# against that converter's own output — same 219 files, same 12,187 line entries, same rates.
#
# This is the half of coverage publishing that does not need Pages, and it is the half that
# changes behaviour: the number lands where the decision is made.
coverage-report:
  stage: deploy
  image: python:3.13-slim
  needs: [build-test]
  script:
    - SRC=""; for d in */src/main/java; do SRC="$SRC $d"; done
    - python3 scripts/jacoco-to-cobertura.py
        jclaw-app/target/site/jacoco-aggregate/jacoco.xml $SRC > cobertura.xml
  artifacts:
    when: always
    expire_in: 2 weeks
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml

# The report as a wiki page, because this instance cannot show it any other way. A wiki page is
# Markdown, which GitLab renders natively at a stable URL — unlike an HTML artifact, which it
# refuses to display without the Pages daemon. What it loses is JaCoCo's clickable source view;
# what it keeps is the part anybody reads.
#
# Opt-in, and silent when it is not set up: WIKI_TOKEN is a project access token with the
# `write_repository` scope, because CI_JOB_TOKEN cannot write a wiki. Without it the rule does not
# match and the job never runs, so a clone of this repository elsewhere does not fail a pipeline
# over a wiki it has no business writing to.
coverage-wiki:
  stage: deploy
  image: alpine:3.21
  needs: [build-test]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - apk add --no-cache git python3
    # Generated first, so the artifact below exists whether or not the page can be published.
    - python3 scripts/coverage-markdown.py
        jclaw-app/target/site/jacoco-aggregate/jacoco.csv "Coverage" > Coverage.md
    # Says why rather than vanishing. Gating the whole job on $WIKI_TOKEN meant that an instance
    # without one had no coverage-wiki job in the pipeline at all, which looks identical to
    # "nothing was ever configured" — and is what someone reads as the feature being broken.
    - |
      if [ -z "${WIKI_TOKEN:-}" ]; then
        echo "coverage-wiki: not published — no WIKI_TOKEN set."
        echo
        echo "  CI_JOB_TOKEN cannot write a wiki, so this needs a project access token:"
        echo "    Settings > Access tokens   — add one with the write_repository scope"
        echo "    Settings > CI/CD > Variables — add it as WIKI_TOKEN, masked"
        echo
        echo "  The report itself is attached to this job as Coverage.md."
        exit 0
      fi
    - |
      set -eu
      # The token stays out of the URL and out of argv: a credential helper hands it to git only
      # when git asks. An embedded token would otherwise appear in every error message git prints
      # about the remote, and those are exactly the messages this job needs to show.
      remote="https://${CI_SERVER_HOST}/${CI_PROJECT_PATH}.wiki.git"
      export WIKI_TOKEN
      helper='!f() { echo username=oauth2; echo "password=$WIKI_TOKEN"; }; f'

      # Retried, for the same reason GET_SOURCES_ATTEMPTS exists at the top of this file: this
      # runner's DNS intermittently cannot resolve the GitLab host. Those variables cover the
      # runner's own fetches; a clone issued from a script is this job's problem to retry.
      retry() {
        attempts="$1"; shift; i=1
        while :; do
          if "$@"; then return 0; fi
          if [ "$i" -ge "$attempts" ]; then return 1; fi
          echo "  attempt $i failed, retrying in $((i * 5))s"
          sleep $((i * 5)); i=$((i + 1))
        done
      }
      clone_wiki() { rm -rf wiki; git -c credential.helper="$helper" clone --quiet "$remote" wiki 2>clone.err; }
      push_wiki()  { git -C wiki push origin "HEAD:$branch"; }

      if retry 4 clone_wiki; then
        branch="$(git -C wiki symbolic-ref --short HEAD 2>/dev/null || echo main)"
      elif grep -qi 'could not resolve host\|temporary failure in name resolution' clone.err; then
        # Not a permission and not a missing wiki: the host did not resolve, four times over.
        # That is the infrastructure flake this file already describes, so it is reported and
        # forgiven rather than dressed up as a broken build. The report is attached either way.
        echo "coverage-wiki: the GitLab host would not resolve from this runner, after 4 tries."
        sed 's/^/    /' clone.err
        echo
        echo "  This is the DNS flake noted at the top of .gitlab-ci.yml, not a fault in the"
        echo "  report or the token. Coverage.md is attached to this job; the next pipeline"
        echo "  will publish it."
        exit 0
      elif grep -q '403' clone.err; then
        # Refused, not absent. Pushing cannot fix a permission, and attempting it buries the real
        # message under a second failure — which is what happened the first time this ran.
        echo "coverage-wiki: WIKI_TOKEN is not allowed to read this wiki. git said:"
        sed 's/^/    /' clone.err
        echo
        echo "  A project access token needs BOTH of these, and the role is the one usually missed:"
        echo "    scope: write_repository   (Settings > Access tokens)"
        echo "    role:  Developer or above — Guest and Reporter are refused with this exact"
        echo "           message, however the scopes are ticked"
        exit 1
      else
        # Absent rather than refused: a wiki has no git repository until it has a page, and
        # GitLab creates one on the first push.
        echo "coverage-wiki: no wiki repository yet. git said:"
        sed 's/^/    /' clone.err
        echo
        echo "  If that is a 404, this is the first page and the push below creates the wiki."
        echo "  If the wiki is switched off entirely, turn it on at"
        echo "    Settings > General > Visibility, project features, permissions > Wiki"
        rm -rf wiki && mkdir -p wiki && git -C wiki init --quiet --initial-branch=main
        branch=main
      fi

      cp Coverage.md wiki/Coverage.md
      git -C wiki config user.email "ci@${CI_SERVER_HOST}"
      git -C wiki config user.name "jclaw CI"
      git -C wiki config credential.helper "$helper"
      git -C wiki remote remove origin 2>/dev/null || true
      git -C wiki remote add origin "$remote"
      git -C wiki add Coverage.md
      if git -C wiki diff --cached --quiet; then
        echo "coverage-wiki: unchanged since the last pipeline"
      else
        git -C wiki commit --quiet -m "Coverage for ${CI_COMMIT_SHORT_SHA}"
        retry 4 push_wiki
        echo "coverage-wiki: published to ${CI_PROJECT_URL}/-/wikis/Coverage"
      fi
  # A report that cannot be published is not a reason to fail a build. The job still goes red on
  # its own row, with git's own words in the log, which is what makes it fixable.
  allow_failure: true
  artifacts:
    when: always
    expire_in: 2 weeks
    paths: [Coverage.md]

pages:
  stage: deploy
  image: debian:bookworm-slim
  needs: [build-test]
  script:
    - test -f jclaw-app/target/site/jacoco-aggregate/index.html
    - rm -rf public && mkdir -p public
    - cp -a jclaw-app/target/site/jacoco-aggregate/. public/
  artifacts:
    paths: [public]
    expire_in: 4 weeks
  rules:
    # Only where Pages actually exists. GitLab predefines CI_PAGES_URL when the feature is
    # enabled for the instance, so this job skips cleanly on one without it instead of failing a
    # pipeline over a deployment target that was never configured — and starts publishing by
    # itself the day somebody sets pages_external_url.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PAGES_URL

# Publishes a GitLab Release for the tag with the native binary and the uber jar attached.
# The files go to the project's generic package registry (a release cannot host files itself)
# and the release links to them. Plain curl against the REST API, authenticated with the job
# token: the official release-cli image is amd64-only and the runner is arm64.
release:
  stage: release
  image:
    # Same image native-image already pulled: runs as root (the curl images run as an
    # unprivileged user that may not be able to write the build directory), ships curl and
    # sha256sum, and needs the same entrypoint override.
    name: ghcr.io/graalvm/native-image-community:25
    entrypoint: [""]
  needs: [build-test, native-image]    # brings their artifacts and native-image's NATIVE_ARCH
  variables:
    GIT_STRATEGY: none                 # nothing here reads the sources
    PKG_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/jclaw/${CI_COMMIT_TAG}"
  script:
    - |
      set -eu
      BIN="jclaw-linux-${NATIVE_ARCH}"
      JAR="$(cd jclaw-app/target && ls jclaw-app-*.jar | head -1)"
      cp "jclaw-app/target/jclaw" "$BIN"
      cp "jclaw-app/target/$JAR" "$JAR"
      sha256sum "$BIN" "$JAR" | tee SHA256SUMS
      for f in "$BIN" "$JAR" SHA256SUMS; do
        echo "uploading $f"
        curl -fsS --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$f" "${PKG_URL}/${f}"
        echo
      done
      cat > release.json <<EOF
      {
        "name": "jclaw ${CI_COMMIT_TAG}",
        "tag_name": "${CI_COMMIT_TAG}",
        "ref": "${CI_COMMIT_SHA}",
        "description": "jclaw ${CI_COMMIT_TAG} (commit ${CI_COMMIT_SHORT_SHA}).\\n\\n- ${BIN}: GraalVM native image, Linux ${NATIVE_ARCH}\\n- ${JAR}: uber jar, needs Java 21+\\n- SHA256SUMS\\n\\nBuilt by pipeline ${CI_PIPELINE_URL}",
        "assets": { "links": [
          { "name": "${BIN}", "url": "${PKG_URL}/${BIN}", "link_type": "package" },
          { "name": "${JAR}", "url": "${PKG_URL}/${JAR}", "link_type": "package" },
          { "name": "SHA256SUMS", "url": "${PKG_URL}/SHA256SUMS", "link_type": "other" }
        ] }
      }
      EOF
      curl -fsS --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --header "Content-Type: application/json" \
           --data @release.json "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
      echo
      echo "released ${CI_PROJECT_URL}/-/releases/${CI_COMMIT_TAG}"
  rules:
    - if: $CI_COMMIT_TAG
